<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taula periòdica – Practica símbols i noms</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Taula periòdica</h1>
    <p class="subtitol">Escriu el símbol i el nom dels elements que falten. Només tens el número atòmic com a pista!</p>
  </header>

  <section class="controls">
    <label>
      Dificultat:
      <select id="dificultat">
        <option value="facil">Fàcil (15%)</option>
        <option value="mitja" selected>Mitjà (35%)</option>
        <option value="dificil">Difícil (60%)</option>
        <option value="extrem">Extrem (100%)</option>
      </select>
    </label>
    <button id="nova-partida">Nova partida</button>
    <button id="repas" class="secundari" disabled>Repassa els errors (0)</button>
    <button id="solucions" class="secundari">Mostrar solucions</button>
  </section>

  <section class="marcador" aria-live="polite">
    <span>Encerts: <strong id="encerts">0</strong> / <strong id="total">0</strong></span>
    <span>Errors: <strong id="errors">0</strong></span>
    <span>Progrés: <strong id="percent">0%</strong></span>
    <span>Temps: <strong id="temps">00:00</strong></span>
  </section>
  <p id="missatge" class="missatge" hidden></p>

  <form id="desar-partida" class="desar-partida" hidden>
    <p id="resum-partida"></p>
    <label>
      El teu nom:
      <input id="nom-jugador" type="text" maxlength="30" autocomplete="off" placeholder="Anònim">
    </label>
    <button type="submit">Desar resultat</button>
  </form>

  <main class="contenidor-taula">
    <div id="taula" class="taula"></div>
  </main>

  <section id="llegenda" class="llegenda"></section>

  <form id="panell-mobil" class="panell-mobil" hidden>
    <div class="panell-capcalera">
      <span id="panell-element" class="panell-element"></span>
      <button type="button" id="panell-tanca" class="secundari" aria-label="Tanca">✕</button>
    </div>
    <div class="panell-camps">
      <input id="panell-simbol" data-camp="simbol" type="text" maxlength="3" placeholder="Símbol"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Símbol">
      <input id="panell-nom" data-camp="nom" type="text" maxlength="20" placeholder="Nom"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Nom">
    </div>
    <div class="panell-accions">
      <button type="submit">Comprova</button>
      <button type="button" id="panell-seguent" class="secundari">Següent ›</button>
    </div>
  </form>

  <section class="resultats">
    <h2>Millors resultats</h2>
    <div id="pestanyes" class="pestanyes" role="group" aria-label="Dificultat del rànquing"></div>
    <div class="contenidor-resultats">
      <table id="ranquing">
        <thead>
          <tr><th>#</th><th>Nom</th><th>Encerts</th><th>Errors</th><th>Temps</th><th>Data</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <details class="historic">
      <summary>Històric de partides</summary>
      <div class="contenidor-resultats">
        <table id="historic">
          <thead>
            <tr><th>Data</th><th>Nom</th><th>Dificultat</th><th>Encerts</th><th>Errors</th><th>Temps</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </details>

    <div class="accions-historic">
      <button id="exportar" type="button" class="secundari">Exportar</button>
      <button id="importar" type="button" class="secundari">Importar</button>
      <input id="fitxer-importar" type="file" accept=".json,application/json" hidden>
      <button id="esborrar" type="button" class="perill">Esborrar històric</button>
    </div>
    <p id="avis-resultats" class="avis" aria-live="polite"></p>
  </section>

  <script src="elements.js"></script>
  <script src="historic.js"></script>
  <script src="app.js"></script>
</body>
</html>
